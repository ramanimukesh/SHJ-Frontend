<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Matches the header, not the logo. While this was the logo's navy,
         Safari painted the toolbar AND the strip exposed when you overscroll
         past the top of the page with it — a dark blue band sitting directly
         above a white nav bar. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts are linked here rather than @import-ed from index.css: an @import
         is only discovered after the stylesheet downloads, which delays first
         paint of every heading on the site. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Jost:wght@400;500&display=swap"
    />

    <!-- LCP element. Preloading it ahead of the JS bundle is the difference
         between a ~1s and a ~3s largest-contentful-paint on mobile.

         imagesrcset/imagesizes are what make the preload agree with the <img>.
         Without them the preload named one fixed file, so a 390px phone
         downloaded the 1600px variant here and the 800px one from the element:
         the hint was costing more than it saved. -->
    <!-- ...but only on the routes that actually show it. As a static tag this
         fired on all 50 URLs, while only the eight top-level pages use this
         photo: every service, solution, industry, technology and case-study
         page downloaded a 1600px hero it then never rendered, which is what
         Chrome's "preloaded but not used" warning was reporting.

         The rule is positional rather than a list of paths, so it cannot fall
         out of step with the router: one path segment or none means a listing
         page (/, /solutions, /work, /contact, and unknown paths, which render
         the 404 over this same photo); two segments means a detail page, which
         brings its own. /about is the one top-level page with a different one.
         Worst case if this is ever wrong is a preload too many or too few. -->
    <script>
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        if (parts.length > 1 || parts[0] === "about") return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = "%PUBLIC_URL%/img/hero/intro-bg-1600.jpg";
        l.imageSrcset =
          "%PUBLIC_URL%/img/hero/intro-bg-800.jpg 800w, %PUBLIC_URL%/img/hero/intro-bg-1600.jpg 1600w, %PUBLIC_URL%/img/hero/intro-bg-2400.jpg 2400w";
        l.imageSizes = "100vw";
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      })();
    </script>

    <!-- .ico first with sizes="any" so legacy browsers take it and modern ones
         skip straight to the SVG, which stays crisp on hi-dpi tabs. -->
    <link rel="icon" href="%PUBLIC_URL%/img/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/img/apple-touch-icon.png" />

    <title>Sahajanand Technologies LLC | Custom Business Software, Automation &amp; Integration</title>
    <meta
      name="description"
      content="Sahajanand Technologies LLC builds custom business software, workflow automation, integrations and practical AI for growing companies. Based in New Jersey."
    />
    <meta name="author" content="Sahajanand Technologies LLC" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sahajanand Technologies LLC" />
    <meta
      property="og:description"
      content="Custom software, business applications, integrations and automation that help organizations work smarter, operate efficiently, and grow."
    />
    <meta property="og:site_name" content="Sahajanand Technologies LLC" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <!-- Real content, not the Create React App placeholder. A crawler that does
         not run JavaScript sees only what is in here, and Google was using the
         old "You need to enable JavaScript to run this app." line as the search
         result description for the whole site. -->
    <noscript>
      <h1>Sahajanand Technologies LLC</h1>
      <p>
        Sahajanand Technologies designs and builds custom business software,
        workflow automation, integrations, reporting and practical AI, built
        around the way your business actually works. We are based in New Jersey
        and work with property and furnished-housing operators, construction and
        remodeling firms, professional services, and small and mid-sized
        companies.
      </p>
      <p>
        Call <a href="tel:732-347-9171">732-347-9171</a> or email
        <a href="mailto:contact@sahajanandtechnologies.com">contact@sahajanandtechnologies.com</a>.
      </p>
      <ul>
        <li><a href="/solutions">Solutions</a></li>
        <li><a href="/service">Services</a></li>
        <li><a href="/industries">Industries</a></li>
        <li><a href="/technology">Technologies</a></li>
        <li><a href="/work">Our work</a></li>
        <li><a href="/about">About us</a></li>
        <li><a href="/contact">Contact us</a></li>
      </ul>
      <p>This site needs JavaScript enabled for the full experience.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
